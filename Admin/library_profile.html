<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Library & Fine Details - Library Management System</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f2f2f2;color:#333}
.sidebar{width:220px;height:100vh;background:#333;position:fixed;left:0;top:0;color:white;overflow-y:auto;padding-bottom:62px}
.sidebar h2{text-align:center;padding:20px 0;margin:0;background:#222}
.sidebar a,.manage{display:block;color:white;text-decoration:none;padding:15px 20px;border-bottom:1px solid #555;cursor:pointer}
.sidebar a:hover,.manage:hover,.sidebar a.active{background:rgba(255,255,255,.11)}
.arrow{float:right}
.submenu{display:none;background:#444}
.submenu a{padding-left:40px}
.logout{position:fixed;bottom:10px;width:220px;background:#222}
.logout a{text-align:center;border-top:1px solid #555}
.main{margin-left:220px;padding:25px;min-height:100vh}
.top{background:white;padding:20px;border:1px solid #ddd;text-align:center;margin-bottom:22px}
.top h1{margin:0;color:#333;font-size:28px}
.top p{margin:8px 0 0;color:#666}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:0}
.tab{padding:12px 20px;border:1px solid #ccc;border-bottom:0;background:#e6e6e6;color:#333;font-size:15px;font-weight:bold;cursor:pointer;border-radius:5px 5px 0 0}
.tab.active{background:#333;color:white;border-color:#333}
.panel{background:white;border:1px solid #ccc;padding:18px;border-radius:0 5px 5px 5px}
.notice{display:none;padding:12px;margin-bottom:15px;border:1px solid;border-radius:4px}
.notice.success{display:block;color:#176b35;background:#eef8f0;border-color:#9bd2aa}
.notice.error{display:block;color:#b00020;background:#fff0f0;border-color:#e4aaaa}
.sections{display:block}.section{display:none}.section.active-section{display:block;max-width:900px;margin:0 auto}
.section{border:1px solid #ddd;background:#fff;min-width:0}
.section-head{background:#eee;padding:15px;border-bottom:1px solid #ddd}
.section-head h2{margin:0 0 5px;font-size:21px}
.section-head p{margin:0;font-size:13px;color:#666}
.section-body{padding:16px}
.field{margin-bottom:14px}
label.field-label{display:block;font-weight:bold;margin-bottom:6px}
.required{color:red}
input,textarea{width:100%;padding:10px;border:1px solid #999;font:15px Arial,sans-serif;outline:none;background:white;color:#333}
textarea{min-height:78px;resize:vertical}
input:focus,textarea:focus{border-color:#333;box-shadow:0 0 0 1px #333}
.invalid{border:2px solid red!important}
.valid{border:2px solid green!important}
.error{display:block;color:red;font-size:13px;margin-top:4px;min-height:15px}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.days{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}
.day{display:flex;align-items:center;gap:7px;border:1px solid #ccc;padding:8px;font-weight:normal;cursor:pointer;font-size:14px}
.day input{width:auto;margin:0;accent-color:#333}
.qr-grid{display:block;max-width:620px}
.qr-upload-card{border:1px dashed #777;background:#fafafa;min-height:0;padding:10px 12px;display:grid;grid-template-columns:minmax(170px,1fr) minmax(190px,230px);align-items:center;gap:12px;text-align:center}
.upload{display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;width:100%;min-height:92px;padding:6px}
.upload strong{margin:5px 0}
.upload small,.hint{color:#666;font-size:12px}
#qrFile{display:none}
.qr-upload-card img{width:220px;height:220px;max-width:100%;object-fit:contain;display:none;grid-column:2;grid-row:1}
.qr-placeholder{width:220px;height:220px;max-width:100%;border:1px dashed #aaa;display:grid;place-items:center;color:#666;font-size:12px;grid-column:2;grid-row:1}
#removeQr{display:none;grid-column:2;grid-row:2;justify-self:center}
@media(max-width:650px){.qr-upload-card{grid-template-columns:1fr;gap:8px}.qr-upload-card img,.qr-placeholder{grid-column:1;grid-row:2;width:200px;height:200px}.upload{grid-column:1;grid-row:1}#removeQr{grid-column:1;grid-row:3}}
button{font:15px Arial,sans-serif;cursor:pointer;border:0;padding:11px 17px}
.primary,.update-button{background:#333;color:white}
.primary:hover,.update-button:hover{background:#555}
.secondary{background:#e7e7e7;color:#333}
.outline{background:white;border:1px solid #999;color:#333}
.actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap;border-top:1px solid #ddd;padding-top:15px;margin-top:16px}
.spacer{flex:1}
.view-mode{display:none}
.details-table{width:100%;border-collapse:collapse;background:white}
.details-table th,.details-table td{padding:12px;border:1px solid #ccc;text-align:left;overflow-wrap:anywhere}
.details-table th{width:32%;background:#eee}
.view-qr{max-width:150px;max-height:150px;object-fit:contain}
@media(max-width:1050px){.sections{display:block}}
@media(max-width:760px){.sidebar{width:180px}.logout{width:180px}.main{margin-left:180px;padding:14px}.two-col,.qr-grid{grid-template-columns:1fr}.days{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:560px){.sidebar{position:relative;width:100%;height:auto;padding-bottom:0}.sidebar h2{padding:14px}.logout{position:static;width:100%}.main{margin-left:0;padding:12px}.top h1{font-size:23px}.panel{padding:10px}.section-body{padding:12px}}
</style>
</head>
<body>
<nav class="sidebar">
  <h2>Library</h2>
  <a href="admin_home.html">Dashboard</a>
  <a href="my_profile.html">My Profile</a>
  <a href="library_profile.html" class="active" aria-current="page">Library Profile</a>
  <div class="manage" id="manageToggle" role="button" tabindex="0" aria-expanded="false">Manage Books <span class="arrow" id="arrow">+</span></div>
  <div class="submenu" id="submenu">
    <a href="view_books.html">View All Books</a>
    <a href="add_book.html">Add Book</a>
    <a href="update_book.html">Update / Delete Book</a>
  </div>
  <a href="issue_book.html">Issue Book</a>
  <a href="return_book.html">Return Book</a>
  <a href="returned_books.html">Recent Returned Books</a>
  <a href="members.html">Members Details</a>
  <a href="announcement.html">Announcements</a>
  <div class="logout"><a href="login_form.html">Logout</a></div>
</nav>
<main class="main">
  <header class="top"><h1>Library Profile</h1></header>
  <div class="tabs">
    <button type="button" class="tab active" data-target="librarySection" role="tab" aria-selected="true">Library Details</button>
    <button type="button" class="tab" data-target="fineSection" role="tab" aria-selected="false">Fine &amp; Payment Details</button>
  </div>
  <div class="panel">
    <div id="notice" class="notice" role="status" aria-live="polite"></div>
    <form id="settingsForm" novalidate>
      <div class="sections">
        <section class="section active-section" id="librarySection">
          <div class="section-head"><h2>Library Details</h2></div>
          <div class="section-body">
            <div class="field"><label class="field-label" for="libraryName">Library Name <span class="required">*</span></label><input id="libraryName" maxlength="100" placeholder="Enter library name"><small class="error" id="libraryNameError"></small></div>
            <div class="field"><label class="field-label" for="address">Library Address <span class="required">*</span></label><textarea id="address" maxlength="250" placeholder="Enter complete address"></textarea><small class="error" id="addressError"></small></div>
            <div class="two-col">
              <div class="field"><label class="field-label" for="phone">Contact Number <span class="required">*</span></label><input id="phone" inputmode="numeric" maxlength="10" placeholder="10-digit mobile number"><small class="error" id="phoneError"></small></div>
              <div class="field"><label class="field-label" for="email">Email Address</label><input id="email" type="email" maxlength="120" placeholder="library@example.com"><small class="error" id="emailError"></small></div>
            </div>
            <div class="two-col">
              <div class="field"><label class="field-label" for="openingTime">Opening Time <span class="required">*</span></label><input id="openingTime" type="time"><small class="error" id="openingTimeError"></small></div>
              <div class="field"><label class="field-label" for="closingTime">Closing Time <span class="required">*</span></label><input id="closingTime" type="time"><small class="error" id="closingTimeError"></small></div>
            </div>
            <div class="field"><label class="field-label">Working Days <span class="required">*</span></label>
              <div class="days">
                <label class="day"><input type="checkbox" name="days" value="Monday" checked> Monday</label>
                <label class="day"><input type="checkbox" name="days" value="Tuesday" checked> Tuesday</label>
                <label class="day"><input type="checkbox" name="days" value="Wednesday" checked> Wednesday</label>
                <label class="day"><input type="checkbox" name="days" value="Thursday" checked> Thursday</label>
                <label class="day"><input type="checkbox" name="days" value="Friday" checked> Friday</label>
                <label class="day"><input type="checkbox" name="days" value="Saturday" checked> Saturday</label>
                <label class="day"><input type="checkbox" name="days" value="Sunday"> Sunday</label>
              </div><small class="error" id="daysError"></small>
            </div>
          </div>
        </section>
        <section class="section" id="fineSection">
          <div class="section-head"><h2>Fine &amp; Payment Details</h2></div>
          <div class="section-body">
            <div class="field"><label class="field-label" for="finePerDay">Fine per Day (₹) <span class="required">*</span></label><input id="finePerDay" type="text" inputmode="decimal" maxlength="8" autocomplete="off" placeholder="e.g. 5"><small class="error" id="finePerDayError"></small></div>
            <div class="field"><label class="field-label" for="upiId">UPI ID <span class="required">*</span></label><input id="upiId" maxlength="100" placeholder="e.g. library@upi"><small class="error" id="upiIdError"></small></div>
            <div class="field"><label class="field-label" for="paymentNumber">Payment Number <span class="required">*</span></label><input id="paymentNumber" inputmode="numeric" maxlength="10" placeholder="10-digit mobile number"><small class="error" id="paymentNumberError"></small></div>
            <div class="field"><label class="field-label">UPI QR Code <span class="required">*</span></label>
              <div class="qr-grid">
                <div class="qr-upload-card">
                  <label class="upload" for="qrFile">
                    <span id="qrUploadIcon" style="font-size:28px">⇧</span>
                    <strong id="qrUploadTitle">Upload QR Code</strong>
                    <small>PNG, JPG or WEBP · Max 2 MB</small>
                    <small id="fileName">No file selected</small>
                  </label>
                  <input type="file" id="qrFile" accept="image/png,image/jpeg,image/webp">
                  <div class="qr-placeholder" id="qrPlaceholder">QR preview appears here</div>
                  <img id="qrImage" alt="UPI QR code preview">
                  <button type="button" class="outline" id="removeQr">Remove QR</button>
                </div>
              </div><small class="error" id="qrFileError"></small>
            </div>
          </div>
        </section>
      </div>
      <div class="actions"><button class="primary" type="submit">Save Details</button><button class="secondary" type="button" id="resetBtn">Reset Form</button><span class="spacer"></span><button class="outline" type="button" id="viewBtn">View Saved Details</button></div>
    </form>
    <section class="view-mode" id="viewMode"><h2>Saved Library Profile</h2><div id="savedDetails"></div><div class="actions"><button class="primary" type="button" id="editBtn">Edit Details</button></div></section>
  </div>
</main>
<script>
const $=id=>document.getElementById(id);
let qrData='';

// Numeric fields accept digits only; the fine amount may also contain one decimal point.
['phone','paymentNumber'].forEach(id => {
  const field = $(id);
  field.setAttribute('type', 'text');
  field.setAttribute('inputmode', 'numeric');
  field.setAttribute('autocomplete', 'off');
  field.addEventListener('input', () => {
    const cleaned = field.value.replace(/\D/g, '').slice(0, 10);
    if (field.value !== cleaned) field.value = cleaned;
  });
});

$('finePerDay').addEventListener('input', () => {
  const field = $('finePerDay');
  let cleaned = field.value.replace(/[^\d.]/g, '');
  const dot = cleaned.indexOf('.');
  if (dot !== -1) {
    cleaned = cleaned.slice(0, dot + 1) + cleaned.slice(dot + 1).replace(/\./g, '');
    const parts = cleaned.split('.');
    cleaned = parts[0] + (parts.length > 1 ? '.' + parts[1].slice(0, 2) : '');
  }
  if (field.value !== cleaned) field.value = cleaned;
});
const fieldIds=['libraryName','address','phone','email','openingTime','closingTime','finePerDay','upiId','paymentNumber'];
const errorIds=['libraryName','address','phone','email','openingTime','closingTime','days','finePerDay','upiId','paymentNumber','qrFile'];
function error(id,msg){$(id+'Error').textContent=msg;const el=$(id);if(el && el.matches('input,textarea'))el.classList.toggle('invalid',!!msg)}
function clearErrors(){errorIds.forEach(id=>error(id,''));fieldIds.forEach(id=>$(id).classList.remove('invalid','valid'));$('notice').className='notice';$('notice').textContent=''}
function days(){return [...document.querySelectorAll('input[name="days"]:checked')].map(x=>x.value)}
function validate(){
 clearErrors();let ok=true;const fail=(id,msg)=>{error(id,msg);ok=false};
 const activeLibrary=$('librarySection').classList.contains('active-section');
 const activeFine=$('fineSection').classList.contains('active-section');
 if(activeLibrary){
  const name=$('libraryName').value.trim(),address=$('address').value.trim(),phone=$('phone').value.trim(),email=$('email').value.trim(),open=$('openingTime').value,close=$('closingTime').value;
  if(name.length<3)fail('libraryName','Library name is required (minimum 3 characters).');
  else if(!/^[\p{L}\p{N}][\p{L}\p{N}\s.'&()-]*$/u.test(name))fail('libraryName','Use letters, numbers, spaces and common punctuation only.');
  if(address.length<10)fail('address','Enter a complete address (minimum 10 characters).');
  if(!/^[6-9]\d{9}$/.test(phone))fail('phone','Enter a valid 10-digit Indian mobile number.');
  if(email&&!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email))fail('email','Enter a valid email address or leave it blank.');
  if(!open)fail('openingTime','Select opening time.');
  if(!close)fail('closingTime','Select closing time.');
  if(open&&close&&close<=open)fail('closingTime','Closing time must be later than opening time.');
  if(!days().length){error('days','Select at least one working day.');ok=false}
 }
 if(activeFine){
  const fine=$('finePerDay').value,upi=$('upiId').value.trim(),pay=$('paymentNumber').value.trim();
  if(fine===''||!Number.isFinite(Number(fine))||Number(fine)<=0||Number(fine)>10000)fail('finePerDay','Enter a fine greater than ₹0 and no more than ₹10,000.');
  if(!/^[A-Za-z0-9._-]{2,256}@[A-Za-z0-9.-]{2,64}$/.test(upi))fail('upiId','Enter a valid UPI ID, e.g. name@bank.');
  if(!/^[6-9]\d{9}$/.test(pay))fail('paymentNumber','Enter a valid 10-digit Indian mobile number.');
  if(!qrData){error('qrFile','Upload the library UPI QR code.');ok=false}
 }
 return ok;
}
function collect(){let old={};try{old=JSON.parse(localStorage.getItem('lmsLibraryFineDetails')||'{}')}catch(e){}const d={...old};if($('librarySection').classList.contains('active-section'))Object.assign(d,{libraryName:$('libraryName').value.trim(),address:$('address').value.trim(),phone:$('phone').value.trim(),email:$('email').value.trim(),openingTime:$('openingTime').value,closingTime:$('closingTime').value,days:days()});if($('fineSection').classList.contains('active-section'))Object.assign(d,{finePerDay:Number($('finePerDay').value),upiId:$('upiId').value.trim(),paymentNumber:$('paymentNumber').value.trim(),qrData});return d}
function showQr(){if(qrData){$('qrImage').src=qrData;$('qrImage').style.display='block';$('qrPlaceholder').style.display='none';$('qrUploadIcon').style.display='none';$('qrUploadTitle').textContent='Change QR Code';$('fileName').textContent='QR code uploaded';$('removeQr').style.display='inline-block'}else{$('qrImage').removeAttribute('src');$('qrImage').style.display='none';$('qrPlaceholder').style.display='grid';$('qrUploadIcon').style.display='block';$('qrUploadTitle').textContent='Upload QR Code';$('fileName').textContent='No file selected';$('removeQr').style.display='none'}}
function fill(d){if(!d)return;fieldIds.forEach(id=>{if(d[id]!==undefined)$(id).value=d[id]});document.querySelectorAll('input[name="days"]').forEach(x=>x.checked=(d.days||[]).includes(x.value));qrData=d.qrData||'';showQr();counts()}
function counts(){}
$('settingsForm').addEventListener('submit',e=>{e.preventDefault();if(!validate()){$('notice').className='notice error';$('notice').textContent='Please correct the highlighted fields before saving.';document.querySelector('.invalid')?.scrollIntoView({behavior:'smooth',block:'center'});return}try{localStorage.setItem('lmsLibraryFineDetails',JSON.stringify(collect()));$('notice').className='notice success';$('notice').textContent='Details saved in this browser.'}catch(err){$('notice').className='notice error';$('notice').textContent='Could not save. Try a smaller QR image.'}});
$('qrFile').addEventListener('change',()=>{error('qrFile','');const f=$('qrFile').files[0];if(!f)return;if(!['image/png','image/jpeg','image/webp'].includes(f.type)){error('qrFile','Choose PNG, JPG or WEBP.');$('qrFile').value='';return}if(f.size>2*1024*1024){error('qrFile','QR image must be 2 MB or smaller.');$('qrFile').value='';return}const reader=new FileReader();reader.onload=()=>{qrData=reader.result;showQr()};reader.readAsDataURL(f)});
$('removeQr').addEventListener('click',()=>{qrData='';$('qrFile').value='';showQr()});
$('resetBtn').addEventListener('click',()=>{if(!confirm('Clear the form? Unsaved changes will be lost.'))return;$('settingsForm').reset();qrData='';showQr();clearErrors();counts()});
const toggle=$('manageToggle');function toggleMenu(){const open=$('submenu').style.display==='block';$('submenu').style.display=open?'none':'block';$('arrow').textContent=open?'+':'−';toggle.setAttribute('aria-expanded',String(!open))}
toggle.addEventListener('click',toggleMenu);toggle.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();toggleMenu()}});
function switchTab(targetId){
  document.querySelectorAll('.tab').forEach(btn=>{
    const selected = btn.dataset.target === targetId;
    btn.classList.toggle('active', selected);
    btn.setAttribute('aria-selected', String(selected));
  });
  document.querySelectorAll('.section').forEach(section=>{
    section.classList.toggle('active-section', section.id === targetId);
  });
  $('notice').className='notice';
  $('notice').textContent='';
}
document.querySelectorAll('.tab').forEach(btn=>btn.addEventListener('click',()=>switchTab(btn.dataset.target)));
$('viewBtn').addEventListener('click',()=>{let d;try{d=JSON.parse(localStorage.getItem('lmsLibraryFineDetails')||'null')}catch(e){}if(!d){$('notice').className='notice error';$('notice').textContent='No saved details found. Save the form first.';return}
const rows=[['Library Name',d.libraryName||'Not saved'],['Address',d.address||'Not saved'],['Contact Number',d.phone||'Not saved'],['Email',d.email||'Not provided'],['Opening Time',d.openingTime||'Not saved'],['Closing Time',d.closingTime||'Not saved'],['Working Days',(d.days||[]).join(', ')||'Not saved'],['Fine per Day',d.finePerDay!=null?'₹'+Number(d.finePerDay).toFixed(2):'Not saved'],['UPI ID',d.upiId||'Not saved'],['Payment Number',d.paymentNumber||'Not saved']];
const table=document.createElement('table');table.className='details-table';rows.forEach(([k,v])=>{const tr=document.createElement('tr'),th=document.createElement('th'),td=document.createElement('td');th.textContent=k;td.textContent=v||'—';tr.append(th,td);table.append(tr)});if(d.qrData){const tr=document.createElement('tr'),th=document.createElement('th'),td=document.createElement('td'),img=document.createElement('img');th.textContent='UPI QR Code';img.src=d.qrData;img.alt='Saved UPI QR code';img.className='view-qr';td.append(img);tr.append(th,td);table.append(tr)}$('savedDetails').replaceChildren(table);$('settingsForm').style.display='none';$('viewMode').style.display='block';$('notice').className='notice'});
$('editBtn').addEventListener('click',()=>{try{fill(JSON.parse(localStorage.getItem('lmsLibraryFineDetails')||'null'))}catch(e){}$('viewMode').style.display='none';$('settingsForm').style.display='block'});
window.addEventListener('DOMContentLoaded',()=>{try{const d=JSON.parse(localStorage.getItem('lmsLibraryFineDetails')||'null');if(d)fill(d)}catch(e){}counts()});
</script>

<script>
document.querySelectorAll('form').forEach(form => {
  form.addEventListener('keydown', event => {
    if (event.key !== 'Enter') return;

    const target = event.target;
    if (!(target instanceof HTMLElement)) return;
    if (target.tagName === 'TEXTAREA' || target.tagName === 'BUTTON') return;
    if (target.type === 'file' || target.type === 'checkbox' || target.type === 'radio') return;

    event.preventDefault();

    const fields = Array.from(form.querySelectorAll(
      'input:not([type="hidden"]):not([type="file"]):not([type="checkbox"]):not([type="radio"]):not([disabled]), select:not([disabled]), textarea:not([disabled]), button:not([disabled])'
    )).filter(el => el.offsetParent !== null && el.type !== 'reset' && el.type !== 'button');

    const index = fields.indexOf(target);
    if (index >= 0 && index < fields.length - 1) {
      fields[index + 1].focus();
      if (typeof fields[index + 1].select === 'function') fields[index + 1].select();
    }
  });
});
</script>

</body>
</html>
