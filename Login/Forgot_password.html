<!DOCTYPE HTML>
<HTML>
<head>
<title>Forgot Password</title>
<style>
body {
    margin-top: 50px;
    font-family: Arial;
    text-align: center;
    background-image: url("background.jpg");
    background-size: cover;
}

form {
    width: 450px;
    min-height: 480px;
    margin: auto;
    padding: 40px 30px;
    border: 2px solid black;
    background-color: white;
    border-radius: 8px;
    box-sizing: border-box;
}

h1 {
    margin-top: 30px;
    margin-bottom: 30px;
    color: #333;
}

label {
    display: block;
    text-align: left;
    font-weight: bold;
    margin-bottom: 5px;
}

input[type='email'],
input[type="text"],
input[type="password"] {
    padding: 10px;
    font-size: 16px;
    margin-bottom: 15px;
    width: 100%;
    box-sizing: border-box;
    background-color: #E8F0FE;
    border: 1px solid #aaa;
    border-radius: 4px;
}

input[type='email']:focus,
input[type="text"]:focus,
input[type="password"]:focus {
    border: 1px solid #555;
    outline: none;
}

.show-password {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 20px;
    text-align: left;
}

.show-password input[type="checkbox"] {
    width: auto;
    margin: 0;
}

.show-password label {
    display: inline;
    font-weight: normal;
    margin: 0;
    cursor: pointer;
}

input[type="submit"] {
    font-size: 18px;
    background-color: #333;
    color: white;
    padding: 10px 25px;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    width: 100%;
}

input[type="submit"]:hover {
    background-color: #555;
}
</style>
</head>

<body>

<script>
function showpassword() {
    var pass = document.getElementById("password");
    var confirmPass = document.getElementById("confirm_password");

    if (pass.type === "password") {
        pass.type = "text";
        confirmPass.type = "text";
    } else {
        pass.type = "password";
        confirmPass.type = "password";
    }
}
</script>

<h1>Reset Password</h1>

<form action='login_form.html' method='post'>

    <label for="email">Email:</label>
    <input type='email' id='email' name='email' minlength="5" maxlength="30" pattern="[A-Za-z0-9@.]+" required title="Enter valid Email" placeholder="Enter Email">

    <label for="username">Username:</label>
    <input type='text' id='username' name='username' minlength="5" maxlength="25" pattern="[A-Za-z0-9@.]+" title="Only letters and numbers are allowed" required placeholder="Enter Username">

    <label for="password">New Password:</label>
    <input type='password' id='password' name='password' minlength="5" maxlength="12" pattern="[A-Za-z0-9@.]+" title="Password can contain only letters, numbers, @ and . (No spaces allowed)" placeholder='Create New Password' required>

    <label for="confirm_password">Confirm Password:</label>
    <input type='password' id='confirm_password' name='confirm_password' minlength="5" maxlength="12" pattern="[A-Za-z0-9@.]+" title="Please re-enter your password" placeholder='Confirm New Password' required>

    <div class="show-password">
        <input type='checkbox' id='show' onclick="showpassword()">
        <label for='show'>Show Passwords</label>
    </div>

    <input type='submit' id="submitbutton" value='Update Password'>

</form>

</body>
</HTML>
