<HTML>
<head>

<title>Login Form </title>
<style>    
.show-password {
    display: flex;
    align-items: 10% center;
    gap: 5px;
    margin-bottom: 15px;
}

body {
    display:flex;
    align-items: center;
    justify-content: center;     
    flex-direction: column;
    font-family:Arial;
    min-height: 100vh;
    background-image: url(Images/library0.png);
    background-repeat: no-repeat;
    background-position:center;
    background-size:cover;
   

}   
form {
    width:270px;
	padding:33px;
    text-align: center;
	border:2px solid black;
    background-color:whitesmoke;
    
}

input[type="text"],
input[type="password"] {
    padding:8px;
	font-size:16px;
	margin-bottom:12px;
    width: 100%;
    box-sizing: border-box;
}

input[type="submit"] {
    font-size: 18px;
	background-color:white;
	color:black;
    padding: 10px 25px;
}

label
{
    display:block;
    text-align: left;
    margin-bottom: -10px;
}


</style>
</head>

<body>



<h1>Login Form</h1>

<script>
function showpassword() {
    var pass = document.getElementById("password");

    if (pass.type === "password") {
        pass.type = "text";
    } else {
        pass.type = "password";
    }
}
</script>

<form action='db.php' method='post' >


<label for='username'>Username:</label><br>
<input type='text' id='username' name='username'  minlength=5 maxlength=25 pattern="[A-Za-z0-9@.]+"
    title="Only letters and numbers are allowed" required placeholder="Enter Username"><br><br>


<label for='password'>Password:</label><br>
<input type='password' id='password' name='password' minlength=5 maxlength=12 pattern="[A-Za-z0-9@.]+" title="Password can contain only letters, numbers, @ and . (No spaces allowed)" placeholder='Enter Password' required>


<div class="show-password">
<input type='checkbox'id='show' onclick="showpassword()">
<label for='show'>Show Password</label> </div>
<br>

<input type='submit' id="submitbutton" value='Login'>
<br><br>

<a href="ForgotPassword.html">Forgot Password ? </a>
<br> <br>
<a href="Registration.html">Create New Account</a>

</form>
</body>
